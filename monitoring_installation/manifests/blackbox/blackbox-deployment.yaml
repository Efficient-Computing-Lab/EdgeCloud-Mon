apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter-master
  namespace: monitoring
  labels:
    app: blackbox-exporter-master
spec:
  replicas: 1                     # Adjust number of pods as needed
  selector:
    matchLabels:
      app: blackbox-exporter-master
  template:
    metadata:
      labels:
        app: blackbox-exporter-master
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:latest
          nodeSelector:
            beta.kubernetes.io/os: linux
            monitoringMaster: 'true'
          args:
            - "--config.file=/config/blackbox.yml"
          ports:
            - containerPort: 9115
              name: http
          securityContext:
            capabilities:
              add: ["NET_RAW"]   # required for ICMP
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: blackbox-config
