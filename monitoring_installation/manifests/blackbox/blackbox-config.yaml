apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
  namespace: monitoring
data:
  blackbox.yml: |
    modules:
      icmp:
        prober: icmp
        timeout: 5s

      tcp_connect:
        prober: tcp
        timeout: 5s

      http_2xx:
        prober: http
        timeout: 5s
        http:
          method: GET
