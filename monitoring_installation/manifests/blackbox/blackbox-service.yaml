apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app: blackbox-exporter-master
spec:
  clusterIP: None   # headless → keeps per-pod identity
  ports:
    - name: http
      port: 9115
      targetPort: http
  selector:
    app: blackbox-exporter-master
